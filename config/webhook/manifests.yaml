---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-fleet-pkarakal-com-v1alpha1-pipelineconfig
  failurePolicy: Fail
  name: vpipelineconfig-v1alpha1.kb.io
  rules:
  - apiGroups:
    - fleet.pkarakal.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - pipelineconfigs
  sideEffects: None
