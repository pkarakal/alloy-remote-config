# This rule is not used by the project alloy-remote-config itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the fleet.pkarakal.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: alloy-remote-config
    app.kubernetes.io/managed-by: kustomize
  name: pipelineconfig-editor-role
rules:
- apiGroups:
  - fleet.pkarakal.com
  resources:
  - pipelineconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - fleet.pkarakal.com
  resources:
  - pipelineconfigs/status
  verbs:
  - get
