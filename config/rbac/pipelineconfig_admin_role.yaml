# This rule is not used by the project alloy-remote-config itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over fleet.pkarakal.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: alloy-remote-config
    app.kubernetes.io/managed-by: kustomize
  name: pipelineconfig-admin-role
rules:
- apiGroups:
  - fleet.pkarakal.com
  resources:
  - pipelineconfigs
  verbs:
  - '*'
- apiGroups:
  - fleet.pkarakal.com
  resources:
  - pipelineconfigs/status
  verbs:
  - get
