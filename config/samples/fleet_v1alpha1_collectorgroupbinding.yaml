# Serves pipelineconfig-sample to collectors that set collector_group to
# "collectorgroup-sample" in their remotecfg attributes. Priority defaults to 100.
apiVersion: fleet.pkarakal.com/v1alpha1
kind: CollectorGroupBinding
metadata:
  labels:
    app.kubernetes.io/name: alloy-remote-config
    app.kubernetes.io/managed-by: kustomize
  name: collectorgroupbinding-sample
spec:
  collectorGroupRef: collectorgroup-sample
  pipelineConfigRef: pipelineconfig-sample
