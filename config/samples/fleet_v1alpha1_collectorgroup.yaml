# Without matchers, collectors join this group by setting the remotecfg attribute
# collector_group to the group name ("collectorgroup-sample").
apiVersion: fleet.pkarakal.com/v1alpha1
kind: CollectorGroup
metadata:
  labels:
    app.kubernetes.io/name: alloy-remote-config
    app.kubernetes.io/managed-by: kustomize
  name: collectorgroup-sample
spec:
  description: This is a sample collector group
