---
apiVersion: fleet.pkarakal.com/v1alpha1
kind: CollectorGroupBinding
metadata:
  name: prod-binding
spec:
  collectorGroupRef: prod
  pipelineConfigRef: prod-config
---
apiVersion: fleet.pkarakal.com/v1alpha1
kind: CollectorGroupBinding
metadata:
  name: acme-binding
spec:
  tenantRef: acme
  pipelineConfigRef: acme-config
