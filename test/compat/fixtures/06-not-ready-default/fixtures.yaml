# The default PipelineConfig has empty content, so no hash is ever set (Unavailable).
# WS-S adds CEL rejecting empty content; this fixture must then move to a
# pre-existing-object path (created before the CRD update).
---
apiVersion: fleet.pkarakal.com/v1alpha1
kind: PipelineConfig
metadata:
  name: default-config
  labels:
    fleet.pkarakal.com/default-pipeline-config: "true"
spec:
  content: ""
  description: Compat fixture default-config
---
apiVersion: fleet.pkarakal.com/v1alpha1
kind: PipelineConfig
metadata:
  name: prod-config
spec:
  content: |
    otelcol.receiver.otlp "default" {
      http {}
      grpc {}

      output {
        metrics = [otelcol.exporter.otlphttp.prod.input]
        logs    = [otelcol.exporter.otlphttp.prod.input]
        traces  = [otelcol.exporter.otlphttp.prod.input]
      }
    }

    otelcol.exporter.otlphttp "prod" {
      client {
        endpoint = sys.env("OTLP_ENDPOINT_PROD")
      }
    }
  description: Compat fixture prod-config
---
apiVersion: fleet.pkarakal.com/v1alpha1
kind: CollectorGroupBinding
metadata:
  name: prod-binding
spec:
  collectorGroupRef: prod
  pipelineConfigRef: prod-config
